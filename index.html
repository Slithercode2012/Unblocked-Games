<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="style.css">

    <header>
        <h1>🎮 Apex Arcade</h1>

    <main class="game-container">
        <div class="game-card">
            <h3>2048</h3>
            <p>Slide tiles and get to the 2048 tile!</p>

        <div class="game-card">
            <h3>Hextris</h3>
            <p>Fast-paced puzzle game inspired by Tetris.</p>
            <a href="https://hextris.io/" target="_blank" class="play-btn">Play Now</a>

        <div class="game-card">
            <h3>Astray</h3>
            <p>Navigate through a 3D canvas maze.</p>
            <a href="https://www.wordsandrock.com/astray/" target="_blank" class="play-btn">Play Now</a>

    <footer>
        <p>&copy; 2026 Apex Arcade. Built with GitHub Pages.</p>
    </footer>
