<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Arcade & Launcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎮 Apex Portal</h1>
        <p>Launch games locally or open any website cleanly.</p>
    </header>

    <section class="launcher-box">
        <h2>🚀 URL Launcher</h2>
        <p>Enter any URL below to launch it cleanly in a new tab.</p>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com">
            <button onclick="launchUrl()">Launch Site</button>
        </div>
    </section>

    <main class="game-container">
        
        <div class="game-card">
            <h3>Retro Snake</h3>
            <p>Play classic snake hosted entirely on this site.</p>
            <button onclick="launchLocalGame('snake.html')" class="play-btn">Play Locally</button>
        </div>

        <div class="game-card">
            <h3>2048</h3>
            <p>Slide tiles and get to the 2048 tile!</p>
            <button onclick="launchDirect('https://gabrielecirulli.github.io/2048/')" class="play-btn">Play 2048</button>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Apex Arcade. Built with GitHub Pages.</p>
    </footer>

    <script>
        // Custom URL Launcher function
        function launchUrl() {
            let url = document.getElementById('urlInput').value.trim();
            
            if (!url) {
                alert('Please enter a URL first!');
                return;
            }

            // Automatically add https:// if it is missing
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            // Opens in a clean new tab to bypass iframe security blocks
            window.open(url, '_blank');
        }

        // Direct launcher for preset external game links
        function launchDirect(targetUrl) {
            window.open(targetUrl, '_blank');
        }

        // Launcher for local HTML game files (like snake.html)
        function launchLocalGame(pageName) {
            const currentPath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            window.open(currentPath + pageName, '_blank');
        }
    </script>

</body>
</html>
